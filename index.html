<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Gallery</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #eef1f7;
      color: #1d2a44;
      line-height: 1.5;
    }

    .header {
      background: #1d2a44;
      color: #ffffff;
      text-align: center;
      padding: 28px 16px;
    }
    .header h1 { font-size: 1.8rem; margin-bottom: 6px; }
    .header p { color: #c9d2e6; }

    .footer {
      background: #1d2a44;
      color: #ffffff;
      text-align: center;
      padding: 16px;
      font-size: 0.9rem;
    }

    main { max-width: 1200px; margin: 0 auto; padding: 32px 16px; }

    /* CSS Grid gallery: 1 column on phones */
    .gallery {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(29, 42, 68, 0.12);
    }

    .card img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 3 / 2;
      object-fit: cover;
    }

    .card figcaption { padding: 12px 16px; font-weight: bold; }

    /* Tablets: 2 columns */
    @media (min-width: 600px) {
      .gallery { grid-template-columns: repeat(2, 1fr); }
    }

    /* Desktops: 3 columns */
    @media (min-width: 1024px) {
      .gallery { grid-template-columns: repeat(3, 1fr); gap: 24px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>Responsive Image Gallery</h1>
    <p>Each image loads a different file size depending on your screen width.</p>
  </header>

  <main>
    <section class="gallery" aria-label="Image gallery">

      <figure class="card">
        <picture>
          <source media="(min-width: 1024px)" srcset="https://picsum.photos/id/10/1200/800">
          <source media="(min-width: 600px)" srcset="https://picsum.photos/id/10/800/533">
          <img src="https://picsum.photos/id/10/480/320" alt="Gallery photo 1" width="480" height="320" loading="lazy">
        </picture>
        <figcaption>Photo 1</figcaption>
      </figure>

      <figure class="card">
        <picture>
          <source media="(min-width: 1024px)" srcset="https://picsum.photos/id/11/1200/800">
          <source media="(min-width: 600px)" srcset="https://picsum.photos/id/11/800/533">
          <img src="https://picsum.photos/id/11/480/320" alt="Gallery photo 2" width="480" height="320" loading="lazy">
        </picture>
        <figcaption>Photo 2</figcaption>
      </figure>

      <figure class="card">
        <picture>
          <source media="(min-width: 1024px)" srcset="https://picsum.photos/id/13/1200/800">
          <source media="(min-width: 600px)" srcset="https://picsum.photos/id/13/800/533">
          <img src="https://picsum.photos/id/13/480/320" alt="Gallery photo 3" width="480" height="320" loading="lazy">
        </picture>
        <figcaption>Photo 3</figcaption>
      </figure>

      <figure class="card">
        <picture>
          <source media="(min-width: 1024px)" srcset="https://picsum.photos/id/14/1200/800">
          <source media="(min-width: 600px)" srcset="https://picsum.photos/id/14/800/533">
          <img src="https://picsum.photos/id/14/480/320" alt="Gallery photo 4" width="480" height="320" loading="lazy">
        </picture>
        <figcaption>Photo 4</figcaption>
      </figure>

      <figure class="card">
        <picture>
          <source media="(min-width: 1024px)" srcset="https://picsum.photos/id/15/1200/800">
          <source media="(min-width: 600px)" srcset="https://picsum.photos/id/15/800/533">
          <img src="https://picsum.photos/id/15/480/320" alt="Gallery photo 5" width="480" height="320" loading="lazy">
        </picture>
        <figcaption>Photo 5</figcaption>
      </figure>

      <figure class="card">
        <picture>
          <source media="(min-width: 1024px)" srcset="https://picsum.photos/id/16/1200/800">
          <source media="(min-width: 600px)" srcset="https://picsum.photos/id/16/800/533">
          <img src="https://picsum.photos/id/16/480/320" alt="Gallery photo 6" width="480" height="320" loading="lazy">
        </picture>
        <figcaption>Photo 6</figcaption>
      </figure>

    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Bhavika. Built for the SkillPilots program.</p>
  </footer>

</body>
</html>
